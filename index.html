<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bomber Arena - Free Bomberman Style Browser Game</title>
<meta name="description" content="Bomber Arena is a free bomber game for mobile and PC. Beat 5 stages, play the daily challenge, collect power-ups and survive the shrinking arena.">
<meta name="theme-color" content="#0e1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="Bomber Arena">
<meta property="og:description" content="Free bomber game: 5 stages, daily challenge, bots and a shrinking arena.">
<style>
:root{--bg:#e9ecf4;--panel:#ffffff;--text:#161a2a;--muted:#5b6482;--accent:#ff5a2e;--line:#c9cfe0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1220;--panel:#1a2036;--text:#eef1fa;--muted:#9aa5c6;--line:#2c3556}}
:root[data-theme="dark"]{--bg:#0e1220;--panel:#1a2036;--text:#eef1fa;--muted:#9aa5c6;--line:#2c3556}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#hud{display:flex;align-items:center;gap:clamp(8px,3vw,22px);padding:8px 12px;border-bottom:1px solid var(--line)}
.s{display:flex;flex-direction:column;line-height:1.1;min-width:38px}
.s small{font-size:11px;color:var(--muted)}
.s b{font-size:clamp(16px,4.5vw,22px);font-variant-numeric:tabular-nums}
#hud .sp{flex:1}
#hud button{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--text);font-size:20px;cursor:pointer}
#stage{flex:1;min-height:0;position:relative;overflow:hidden}
#c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,.35)}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,14,28,.62);padding:16px}
#ov[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:380px;width:100%;text-align:center}
.card h1{margin:0 0 6px;font-size:clamp(26px,7vw,34px);letter-spacing:.5px}
.card p{margin:6px 0 14px;color:var(--muted);line-height:1.45;font-size:15px}
.card button{display:block;width:100%;margin-top:10px;padding:18px;min-height:58px;border-radius:14px;font:inherit;font-weight:700;font-size:20px;cursor:pointer;border:2px solid var(--accent);background:var(--accent);color:#fff}
.card button.sec{background:transparent;color:var(--text);border-color:var(--line)}
.card button[hidden]{display:none}
.card{max-height:100%;overflow:auto}
#stg{display:flex;gap:8px;justify-content:center;margin:4px 0 6px}
#stg[hidden]{display:none}
#stg button{margin:0;width:54px;height:54px;min-height:0;padding:0;font-size:22px;background:transparent;color:var(--text);border-color:var(--line)}
#stg button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
#stg button:disabled{opacity:.35;cursor:not-allowed}
#skn{display:flex;gap:12px;justify-content:center;margin:6px 0}
#skn button{margin:0;width:54px;height:54px;min-height:0;padding:0;border-radius:50%;border:3px solid var(--line)}
#skn button.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.card .cl{margin:8px 0 2px;font-size:13px}
.card .tip{font-size:13px;margin:14px 0 0}
button:focus-visible{outline:3px solid #ffbf3d;outline-offset:2px}
#touch{display:none;justify-content:space-between;align-items:center;padding:8px 18px 12px}
@media (pointer:coarse){#touch{display:flex}}
@media (pointer:coarse) and (orientation:landscape){#touch{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);padding:0 22px 10px;pointer-events:none}#touch>*{pointer-events:auto;opacity:.85}}
#dp{--k:clamp(62px,19vw,82px);display:grid;grid-template-columns:repeat(3,var(--k));grid-template-rows:repeat(3,var(--k));grid-template-areas:". u ." "l . r" ". d ."}
#dp button,#bm{border:2px solid var(--line);background:var(--panel);color:var(--text);font-size:30px;border-radius:18px;touch-action:none}
#dp button:active,#bm:active,#dp button.on,#bm.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#dp .u{grid-area:u}#dp .l{grid-area:l}#dp .r{grid-area:r}#dp .d{grid-area:d}
#bm{width:clamp(92px,27vw,116px);height:clamp(92px,27vw,116px);border-radius:50%;font-size:46px}
</style>
</head>
<body>
<div id="hud">
<div class="s"><small>Score</small><b id="sc">0</b></div>
<div class="s"><small>Time</small><b id="tm">0:00</b></div>
<div class="s"><small>Bots</small><b id="bt">3</b></div>
<div class="s"><small>Stage</small><b id="st">1</b></div>
<div class="sp"></div>
<button id="pz" aria-label="Pause">❚❚</button>
<button id="mu" aria-label="Sound on or off">🔊</button>
</div>
<div id="stage">
<canvas id="c"></canvas>
<div id="ov"><div class="card">
<h1 id="ot">Bomber Arena</h1>
<p id="os">Blow up the bricks, grab power-ups and beat 3 bots. After 40 seconds the arena starts to shrink.</p>
<div id="pk"><p class="cl">Pick your character, then a stage</p><div id="skn"></div><div id="stg"></div></div>
<button id="go">Play</button>
<button id="dl" class="sec">Daily challenge</button>
<button id="sh" class="sec" hidden>Share score</button>
<button id="mn" class="sec" hidden>Main menu</button>
<p class="tip" id="tp">Move: arrow keys or WASD. Bomb: Space. Pause: P.</p>
<p class="tip" id="lb"></p>
</div></div>
</div>
<div id="touch">
<div id="dp"><button class="u" data-d="0" aria-label="Up">▲</button><button class="l" data-d="3" aria-label="Left">◀</button><button class="r" data-d="1" aria-label="Right">▶</button><button class="d" data-d="2" aria-label="Down">▼</button></div>
<button id="bm" aria-label="Drop bomb">💣</button>
</div>
<script>
(()=>{
const W=13,H=11,T=48,CW=W*T,CH=H*T;
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const COLS=['#3da5ff','#ff5d73','#44d17a','#ffc83d'];
const SP=[[1,1],[W-2,1],[1,H-2],[W-2,H-2]];
const STAGES=[{n:'Warm-up',bots:1,spd:2.8,dens:.6,shr:55},{n:'Brick yard',bots:2,spd:3.2,dens:.72,shr:45},{n:'Triple threat',bots:3,spd:3.4,dens:.74,shr:40},{n:'Fast bots',bots:3,spd:4,dens:.78,shr:32},{n:'Final arena',bots:3,spd:4.6,dens:.8,shr:25}];
const SKINS=['#3da5ff','#b46cff','#ff8fd1','#f2f4ff'];
let lvl=0,unlocked=1,base=0,rng=Math.random,daily=false,skin=0;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),stage=$('stage');
let grid,items,bombs,flames,ps,state='menu',time=0,an=0,score=0,best=0,endT=0,result='',shrinkList=[],shrinkIdx=0,shrinkT=0,held=[],muted=false,bombReq=false;
try{best=+localStorage.getItem('bomber-best')||0;unlocked=Math.min(5,Math.max(1,+localStorage.getItem('bomber-unlocked')||1));skin=Math.min(3,+localStorage.getItem('bomber-skin')||0)}catch(e){}

/* ---------- audio ---------- */
let ac;
function snd(f,d,type,v,slide){
 if(muted)return;
 try{
  ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume();
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(t+d);
 }catch(e){}
}

/* ---------- sizing ---------- */
function resize(){
 const r=stage.getBoundingClientRect();
 const s=Math.min((r.width-12)/CW,(r.height-12)/CH);
 const w=Math.max(160,Math.floor(CW*s)),h=Math.floor(w*CH/CW);
 const dpr=Math.min(window.devicePixelRatio||1,2);
 cv.style.width=w+'px';cv.style.height=h+'px';
 cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));

/* ---------- world ---------- */
const solid=g=>g===1||g===3;
const bombAt=(x,y)=>bombs.some(b=>b.x===x&&b.y===y);
const canEnter=(x,y)=>grid[y]&&grid[y][x]===0&&!bombAt(x,y);
const lc=p=>p.mv&&p.mv.t>.5?[p.mv.x,p.mv.y]:[p.cx,p.cy];
const ownCount=p=>bombs.filter(b=>b.o===p).length;

function spiral(){
 const o=[];let x0=1,y0=1,x1=W-2,y1=H-2;
 while(x0<=x1&&y0<=y1){
  for(let x=x0;x<=x1;x++)o.push([x,y0]);
  for(let y=y0+1;y<=y1;y++)o.push([x1,y]);
  if(y0<y1)for(let x=x1-1;x>=x0;x--)o.push([x,y1]);
  if(x0<x1)for(let y=y1-1;y>y0;y--)o.push([x0,y]);
  x0++;y0++;x1--;y1--;
 }
 return o;
}
function init(){
 grid=[];items=[];bombs=[];flames=[];
 for(let y=0;y<H;y++){grid.push([]);items.push([]);
  for(let x=0;x<W;x++){
   const edge=x===0||y===0||x===W-1||y===H-1;
   grid[y].push(edge||(x%2===0&&y%2===0)?1:(rng()<STAGES[lvl].dens?2:0));
   items[y].push(null);
  }}
 SP.forEach(([sx,sy])=>{for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
  const x=sx+dx,y=sy+dy;
  if(Math.abs(dx)+Math.abs(dy)<=1&&x>0&&y>0&&x<W-1&&y<H-1&&grid[y][x]===2)grid[y][x]=0;}});
 ps=SP.slice(0,STAGES[lvl].bots+1).map((s,i)=>({i,ai:i>0,cx:s[0],cy:s[1],mv:null,dir:2,alive:true,maxB:1,range:2,spd:i?STAGES[lvl].spd:4.2,col:i?COLS[i]:SKINS[skin],carry:0}));
 shrinkList=spiral();shrinkIdx=0;shrinkT=0;time=0;endT=0;result='';
}

/* ---------- bombs and blasts ---------- */
function cellsOf(x,y,r){
 const o=[[x,y]];
 for(const [dx,dy] of DIRS)for(let k=1;k<=r;k++){
  const nx=x+dx*k,ny=y+dy*k,g=grid[ny][nx];
  if(solid(g))break;
  o.push([nx,ny]);
  if(g===2)break;
 }
 return o;
}
function placeBomb(p){
 const [x,y]=lc(p);
 if(!p.alive||ownCount(p)>=p.maxB||bombAt(x,y))return false;
 bombs.push({x,y,t:2.3,r:p.range,o:p});
 snd(220,.12,'square',.05,-90);
 return true;
}
function explode(b){
 const i=bombs.indexOf(b);if(i<0)return;
 bombs.splice(i,1);
 snd(130,.4,'sawtooth',.09,-90);
 for(const [x,y] of cellsOf(b.x,b.y,b.r)){
  flames.push({x,y,t:.45,o:b.o});
  items[y][x]=null;
  if(grid[y][x]===2){
   grid[y][x]=0;
   if(b.o===ps[0])score+=10;
   const r=Math.random();
   if(r<.34)items[y][x]=r<.12?'B':r<.23?'F':'S';
  }
  const o=bombs.find(q=>q.x===x&&q.y===y);
  if(o)explode(o);
 }
}
function kill(p,by){
 if(!p.alive)return;
 p.alive=false;snd(300,.5,'sawtooth',.07,-220);
 if(by&&by!==p&&by===ps[0])score+=100;
}

/* ---------- bots ---------- */
function dangerSet(){
 const s=new Set();
 bombs.forEach(b=>cellsOf(b.x,b.y,b.r).forEach(c=>s.add(c[1]*W+c[0])));
 flames.forEach(f=>s.add(f.y*W+f.x));
 return s;
}
function bfs(sx,sy,danger,allowD,goal){
 const q=[[sx,sy,-1]],seen=new Set([sy*W+sx]);
 for(let i=0;i<q.length;i++){
  const [x,y,f]=q[i];
  if(i>0&&goal(x,y))return f;
  for(let d=0;d<4;d++){
   const nx=x+DIRS[d][0],ny=y+DIRS[d][1],k=ny*W+nx;
   if(seen.has(k)||!canEnter(nx,ny)||(!allowD&&danger.has(k)))continue;
   seen.add(k);q.push([nx,ny,f<0?d:f]);
  }
 }
 return -2;
}
function enemyAt(p,x,y){return ps.some(q=>q!==p&&q.alive&&lc(q)[0]===x&&lc(q)[1]===y)}
function decide(p){
 const danger=dangerSet(),here=p.cy*W+p.cx;
 const safe=(x,y)=>!danger.has(y*W+x);
 if(danger.has(here)){
  const d=bfs(p.cx,p.cy,danger,true,safe);
  return d>=0?d:-1;
 }
 if(ownCount(p)<p.maxB&&!bombAt(p.cx,p.cy)&&Math.random()<.7){
  const cells=cellsOf(p.cx,p.cy,p.range);
  if(cells.some(([x,y])=>(x!==p.cx||y!==p.cy)&&(grid[y][x]===2||enemyAt(p,x,y)))){
   const d2=new Set(danger);cells.forEach(([x,y])=>d2.add(y*W+x));
   if(bfs(p.cx,p.cy,d2,true,(x,y)=>!d2.has(y*W+x))>=0){placeBomb(p);return -1}
  }
 }
 const want=(x,y)=>DIRS.some(([dx,dy])=>grid[y+dy][x+dx]===2||enemyAt(p,x+dx,y+dy));
 let d=bfs(p.cx,p.cy,danger,false,want);
 if(d>=0)return d;
 const opts=[0,1,2,3].filter(k=>canEnter(p.cx+DIRS[k][0],p.cy+DIRS[k][1])&&safe(p.cx+DIRS[k][0],p.cy+DIRS[k][1]));
 return opts.length?opts[Math.random()*opts.length|0]:-1;
}

/* ---------- update ---------- */
function tryMove(p,d,carry){
 p.dir=d;
 const nx=p.cx+DIRS[d][0],ny=p.cy+DIRS[d][1];
 if(canEnter(nx,ny))p.mv={x:nx,y:ny,t:carry||0};
}
function closeNext(){
 while(shrinkIdx<shrinkList.length){
  const [x,y]=shrinkList[shrinkIdx++];
  if(solid(grid[y][x]))continue;
  grid[y][x]=3;items[y][x]=null;
  bombs=bombs.filter(b=>!(b.x===x&&b.y===y));
  ps.forEach(p=>{if(p.alive&&((p.cx===x&&p.cy===y)||(p.mv&&p.mv.x===x&&p.mv.y===y)))kill(p)});
  snd(90,.2,'square',.05,-30);
  break;
 }
}
function update(dt){
 time+=dt;
 for(const p of ps){
  if(!p.alive)continue;
  if(p.mv){
   p.mv.t+=dt*p.spd;
   if(p.mv.t>=1){p.carry=p.mv.t-1;p.cx=p.mv.x;p.cy=p.mv.y;p.mv=null}
  }
  if(!p.mv){
   const d=p.ai?decide(p):(held.length?held[held.length-1]:-1);
   if(d>=0)tryMove(p,d,p.ai?0:p.carry);
   p.carry=0;
  }
 }
 if(bombReq){bombReq=false;if(ps[0].alive)placeBomb(ps[0])}
 for(const b of bombs.slice()){b.t-=dt;if(b.t<=0)explode(b)}
 flames=flames.filter(f=>(f.t-=dt)>0);
 for(const p of ps){
  if(!p.alive)continue;
  const [x,y]=lc(p);
  const f=flames.find(f=>f.x===x&&f.y===y);
  if(f){kill(p,f.o);continue}
  const it=items[y][x];
  if(it){
   items[y][x]=null;
   if(it==='B')p.maxB=Math.min(5,p.maxB+1);
   if(it==='F')p.range=Math.min(7,p.range+1);
   if(it==='S')p.spd=Math.min(p.ai?5:6.4,p.spd+.5);
   if(!p.ai){score+=20;snd(600,.15,'triangle',.06,500)}
  }
 }
 if(time>STAGES[lvl].shr){shrinkT-=dt;if(shrinkT<=0){closeNext();shrinkT=.6}}
 const left=ps.slice(1).filter(p=>p.alive).length;
 if(!endT){
  if(!ps[0].alive){endT=1.3;result=left?'lose':'draw'}
  else if(!left){endT=1.3;result='win';score+=500+Math.max(0,Math.round(150-time));snd(520,.4,'triangle',.07,400)}
 }else if((endT-=dt)<=0)finish();
}

/* ---------- drawing ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function block(px,py,base,hi,lo){
 ctx.fillStyle=base;ctx.fillRect(px+1,py+1,T-2,T-2);
 ctx.fillStyle=hi;ctx.fillRect(px+1,py+1,T-2,6);ctx.fillRect(px+1,py+1,6,T-2);
 ctx.fillStyle=lo;ctx.fillRect(px+1,py+T-7,T-2,6);ctx.fillRect(px+T-7,py+1,6,T-2);
}
function brick(px,py){
 ctx.fillStyle='#c4673a';rr(px+2,py+2,T-4,T-4,5);ctx.fill();
 ctx.strokeStyle='#7d3b1f';ctx.lineWidth=2;
 ctx.beginPath();
 for(let k=1;k<3;k++){ctx.moveTo(px+3,py+2+k*(T-4)/3);ctx.lineTo(px+T-3,py+2+k*(T-4)/3)}
 ctx.moveTo(px+T/2,py+3);ctx.lineTo(px+T/2,py+T/3+1);
 ctx.moveTo(px+T/3,py+T/3);ctx.lineTo(px+T/3,py+2*T/3);
 ctx.moveTo(px+2*T/3,py+T/3);ctx.lineTo(px+2*T/3,py+2*T/3);
 ctx.moveTo(px+T/2,py+2*T/3);ctx.lineTo(px+T/2,py+T-3);
 ctx.stroke();
 ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(px+4,py+4,T-8,3);
}
function drawP(p){
 let x=p.cx,y=p.cy;
 if(p.mv){x+=(p.mv.x-p.cx)*p.mv.t;y+=(p.mv.y-p.cy)*p.mv.t}
 const px=x*T+T/2,py=y*T+T/2,bob=p.mv?Math.abs(Math.sin(an*14))*3:0;
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(px,py+16,15,6,0,0,7);ctx.fill();
 ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(px,py-3-bob,17,0,7);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.arc(px-5,py-10-bob,7,0,7);ctx.fill();
 ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,py-3-bob,17,0,7);ctx.stroke();
 const dx=DIRS[p.dir][0]*3,dy=DIRS[p.dir][1]*2;
 for(const s of[-6,6]){
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(px+s+dx,py-5-bob+dy,4.5,5.5,0,0,7);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(px+s+dx*1.6,py-5-bob+dy*1.4,2.2,0,7);ctx.fill();
 }
 if(!p.ai){
  const a=skin,ty=py-20-bob;ctx.fillStyle='#222';ctx.strokeStyle='#222';ctx.lineWidth=2;
  if(a===0){ctx.beginPath();ctx.moveTo(px,ty);ctx.lineTo(px,ty-9);ctx.stroke();ctx.fillStyle='#ff5a2e';ctx.beginPath();ctx.arc(px,ty-11,3.5,0,7);ctx.fill()}
  else if(a===1){ctx.fillStyle=p.col;for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(px+s*14,ty+3);ctx.lineTo(px+s*13,ty-9);ctx.lineTo(px+s*4,ty);ctx.closePath();ctx.fill();ctx.stroke()}}
  else if(a===2){ctx.fillStyle='#ffd23d';ctx.beginPath();ctx.moveTo(px-10,ty+2);ctx.lineTo(px-10,ty-8);ctx.lineTo(px-5,ty-3);ctx.lineTo(px,ty-10);ctx.lineTo(px+5,ty-3);ctx.lineTo(px+10,ty-8);ctx.lineTo(px+10,ty+2);ctx.closePath();ctx.fill();ctx.stroke()}
  else{ctx.fillRect(px-13,py-8-bob,26,6)}
 }
 if(!p.ai){
  const b=Math.sin(an*6)*2;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(px-6,py-31-bob+b);ctx.lineTo(px+6,py-31-bob+b);ctx.lineTo(px,py-24-bob+b);ctx.closePath();ctx.fill();
 }
}
const IC={B:['#3d8bff','B'],F:['#ff5a3d','F'],S:['#2ecc71','S']};
function draw(){
 ctx.setTransform(cv.width/CW,0,0,cv.height/CH,0,0);
 ctx.clearRect(0,0,CW,CH);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const px=x*T,py=y*T,g=grid[y][x];
  ctx.fillStyle=(x+y)%2?'#2b3654':'#26304c';ctx.fillRect(px,py,T,T);
  if(g===1){const e=x===0||y===0||x===W-1||y===H-1;block(px,py,e?'#434d6e':'#5d6a8f',e?'#566285':'#7f8db5',e?'#2f3855':'#434e70')}
  else if(g===3)block(px,py,'#8a4a5a','#a8606f','#5e2f3c');
  else if(g===2)brick(px,py);
  else if(y>0&&solid(grid[y-1][x])){ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(px,py,T,7)}
 }
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 18px Trebuchet MS, sans-serif';
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const it=items[y][x];if(!it)continue;
  const cx=x*T+T/2,cy=y*T+T/2+Math.sin(an*4+x)*2;
  ctx.fillStyle=IC[it][0];ctx.beginPath();ctx.arc(cx,cy,16,0,7);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#fff';ctx.fillText(IC[it][1],cx,cy+1);
 }
 for(const f of flames){
  const a=Math.min(1,f.t/.3),px=f.x*T,py=f.y*T;
  ctx.fillStyle='rgba(255,110,30,'+a+')';rr(px+3,py+3,T-6,T-6,10);ctx.fill();
  ctx.fillStyle='rgba(255,220,90,'+a+')';rr(px+10,py+10,T-20,T-20,7);ctx.fill();
 }
 for(const b of bombs){
  const cx=b.x*T+T/2,cy=b.y*T+T/2+3,s=1+.08*Math.sin(an*12);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(cx,cy+13,14,5,0,0,7);ctx.fill();
  ctx.fillStyle=b.t<.7&&Math.sin(an*30)>0?'#c0392b':'#1b1b26';
  ctx.beginPath();ctx.arc(cx,cy,16*s,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.arc(cx-5,cy-6,4,0,7);ctx.fill();
  ctx.strokeStyle='#caa46a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx+6,cy-12);ctx.quadraticCurveTo(cx+12,cy-20,cx+16,cy-17);ctx.stroke();
  ctx.fillStyle=Math.sin(an*25)>0?'#ffd23d':'#ff6a2e';ctx.beginPath();ctx.arc(cx+16,cy-17,3.5,0,7);ctx.fill();
 }
 ps.filter(p=>p.alive).sort((a,b)=>a.cy-b.cy).forEach(drawP);
 if(time>STAGES[lvl].shr&&state==='play'&&shrinkIdx<shrinkList.length){
  ctx.font='bold 16px Trebuchet MS, sans-serif';ctx.fillStyle='rgba(255,255,255,'+(.55+.4*Math.sin(an*5))+')';
  ctx.fillText('Arena is shrinking!',CW/2,T/2);
 }
}

/* ---------- ui and flow ---------- */
const ov=$('ov'),go=$('go'),sh=$('sh');
function setHud(){
 $('sc').textContent=score;
 const t=Math.floor(time);$('tm').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
 $('bt').textContent=ps.slice(1).filter(p=>p.alive).length;
 $('st').textContent=lvl+1;
}
function showOv(title,sub,btn,share){
 $('ot').textContent=title;$('os').textContent=sub;go.textContent=btn;sh.hidden=!share;
 $('tp').hidden=state==='over';$('pk').hidden=state!=='menu';$('dl').hidden=state!=='menu';$('mn').hidden=state==='menu';$('lb').textContent=lbText();ov.hidden=false;
}
function mul(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dayKey(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function lbText(){let a=[],d=0;try{a=JSON.parse(localStorage.getItem('bomber-lb')||'[]');d=+localStorage.getItem('bomber-d'+dayKey())||0}catch(e){}const t=a.length?'Top scores: '+a.map(x=>x.s).join(', ')+'.':'';return t+(d?(t?' ':'')+'Daily best today: '+d+'.':'')}
function buildSkn(){const e=$('skn');e.innerHTML='';SKINS.forEach((s,i)=>{const b=document.createElement('button');b.style.background=s;b.className=i===skin?'sel':'';b.setAttribute('aria-label','Character '+(i+1));b.onclick=()=>{skin=i;try{localStorage.setItem('bomber-skin',String(i))}catch(x){}init();buildSkn()};e.appendChild(b)})}
let mt=null,mstep=0;const NOTES=[110,0,131,0,147,0,131,0,110,0,165,0,147,0,131,0];
function music(on){clearInterval(mt);mt=null;if(on&&!muted)mt=setInterval(()=>{const n=NOTES[mstep++%16];if(n)snd(n,.2,'triangle',.025)},230)}
function begin(newRun){if(newRun)score=0;base=score;rng=daily?mul(dayKey()*10+lvl):Math.random;init();held=[];state='play';ov.hidden=true;go.blur();snd(440,.15,'triangle',.05,200);music(true)}
function desc(){const s=STAGES[lvl];return 'Stage '+(lvl+1)+': '+s.n+'. Beat '+s.bots+(s.bots>1?' bots':' bot')+' before the arena starts shrinking at '+s.shr+' seconds.'}
function buildStg(){const e=$('stg');e.innerHTML='';STAGES.forEach((s,i)=>{const b=document.createElement('button');b.textContent=i+1;b.disabled=i>=unlocked;b.title=s.n;b.className=i===lvl?'sel':'';b.onclick=()=>{lvl=i;buildStg();$('os').textContent=desc()};e.appendChild(b)})}
function pause(){if(state!=='play')return;state='pause';held=[];music(false);showOv('Paused','Take a break. Your game is waiting.','Resume',false)}
function resume(){if(state!=='pause')return;state='play';ov.hidden=true;go.blur();music(true)}
function finish(){
 state='over';music(false);
 try{if(score>0){const a=JSON.parse(localStorage.getItem('bomber-lb')||'[]');a.push({s:score});a.sort((x,y)=>y.s-x.s);localStorage.setItem('bomber-lb',JSON.stringify(a.slice(0,5)));if(daily){const k='bomber-d'+dayKey();if(score>(+localStorage.getItem(k)||0))localStorage.setItem(k,String(score))}}}catch(e){}
 if(score>best){best=score;try{localStorage.setItem('bomber-best',String(best))}catch(e){}}
 const last=lvl===STAGES.length-1,win=result==='win';
 if(win&&!last&&!daily){unlocked=Math.max(unlocked,lvl+2);try{localStorage.setItem('bomber-unlocked',String(unlocked))}catch(e){}}
 const t=daily&&win?'Daily cleared!':win?(last?'All stages cleared!':'Stage '+(lvl+1)+' cleared!'):result==='draw'?'Draw':'You were blown up';
 const s=win?'Score: '+score+'.':'Score: '+score+'. Keep an escape route from every bomb.';
 showOv(t,s+' Best: '+best+'.',daily?'Play daily again':win?(last?'Play again':'Next stage'):'Retry stage',true);
}
go.addEventListener('click',()=>{
 if(state==='pause')return resume();
 if(state==='over'&&daily)return begin(true);
 if(state==='over'&&result==='win'&&lvl<STAGES.length-1){lvl++;return begin(false)}
 if(state==='over'&&result==='win'){lvl=0;return begin(true)}
 if(state==='over'){score=base;return begin(false)}
 daily=false;begin(true);
});
$('dl').addEventListener('click',()=>{daily=true;lvl=2;begin(true)});
$('mn').addEventListener('click',()=>{daily=false;state='menu';held=[];music(false);init();buildStg();buildSkn();showOv('Bomber Arena',desc(),'Play',false)});
sh.addEventListener('click',async()=>{
 const text='I scored '+score+' in Bomber Arena! Can you beat me? '+location.href;
 try{
  if(navigator.share)await navigator.share({text});
  else{await navigator.clipboard.writeText(text);sh.textContent='Copied to clipboard'}
 }catch(e){}
});
$('pz').addEventListener('click',()=>state==='pause'?resume():pause());
$('mu').addEventListener('click',e=>{muted=!muted;e.currentTarget.textContent=muted?'🔇':'🔊';music(!muted&&state==='play')});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

/* keyboard */
const KEYS={ArrowUp:0,w:0,W:0,ArrowRight:1,d:1,D:1,ArrowDown:2,s:2,S:2,ArrowLeft:3,a:3,A:3};
addEventListener('keydown',e=>{
 if(e.repeat&&(e.key===' '||e.key==='Enter'))return;
 if(e.key==='p'||e.key==='P'||e.key==='Escape'){e.preventDefault();state==='pause'?resume():pause();return}
 if(e.key===' '||e.key==='Enter'){
  e.preventDefault();
  if(state==='menu'||state==='over')go.click();
  else if(state==='pause')resume();
  else bombReq=true;
  return;
 }
 if(e.key==='b'||e.key==='B'){bombReq=true;return}
 if(e.key in KEYS){e.preventDefault();const d=KEYS[e.key];if(!held.includes(d))held.push(d)}
});
addEventListener('keyup',e=>{if(e.key in KEYS){const i=held.indexOf(KEYS[e.key]);if(i>=0)held.splice(i,1)}});
addEventListener('blur',()=>{held=[]});

/* touch */
document.querySelectorAll('#dp button').forEach(b=>{
 const d=+b.dataset.d;
 const off=()=>{const i=held.indexOf(d);if(i>=0)held.splice(i,1);b.classList.remove('on')};
 b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(x){}if(!held.includes(d))held.push(d);b.classList.add('on')});
 b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
});
const bm=$('bm');
bm.addEventListener('pointerdown',e=>{e.preventDefault();bombReq=true;bm.classList.add('on')});
['pointerup','pointercancel','pointerleave'].forEach(n=>bm.addEventListener(n,()=>bm.classList.remove('on')));
addEventListener('contextmenu',e=>e.preventDefault());

/* loop */
let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 an+=dt;
 if(state==='play'||(state==='over'&&false))update(dt);
 else if(state==='over'){flames=flames.filter(f=>(f.t-=dt)>0)}
 draw();setHud();
 requestAnimationFrame(loop);
}
init();buildStg();buildSkn();$('os').textContent=desc();$('lb').textContent=lbText();resize();
requestAnimationFrame(loop);
new ResizeObserver(resize).observe(stage);
})();
</script>
</body>
</html>
